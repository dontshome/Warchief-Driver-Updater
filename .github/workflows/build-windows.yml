name: Build Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload the build to (leave empty to just keep it as a workflow artifact)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build (app + installer)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\Build.ps1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: warchief-driver-updater-windows
          path: |
            dist/*.exe

      - name: Upload to release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ inputs.release_tag }}" dist/*.exe --clobber
